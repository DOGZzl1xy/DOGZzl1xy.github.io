<!doctype html>
<html class="no-js" lang="en">
<head>
{% include head.html %}
</head>

<body class="site-body page-default" itemscope itemtype="http://schema.org/WebPage">
{% include navigation.html %}

<main class="site-main" role="main" itemprop="mainContentOfPage">
  <div class="site-main__inner">
    <div class="content-layout">
      <aside class="content-sidebar">
        {% include author-bio.html %}
      </aside>

      <article class="content-card" itemscope itemtype="http://schema.org/CreativeWork">
        <div class="article-wrap" itemprop="text">
          {{ content }}
        </div>
      </article>
    </div>
  </div>
</main>

<div class="site-footer-wrap">
  {% include footer.html %}
</div>
</body>
</html>
