<div class="navigation-wrapper">
	<div class="site-name">
		<a href="{{ site.url }}">{{ site.title }}</a>
	</div>{% capture url %}{{ page.url | remove:'index.html' }}{% endcapture %}
	<div class="top-navigation">
		<nav role="navigation" itemscope itemtype="http://schema.org/SiteNavigationElement">
		    <ul>
		        {% for link in site.links %}
              {% if link.title == "Projects" %}
                  <li class="dropdown">
                      <a href="{{ site.url }}{{ link.url }}" {% if page.url contains '/projects/' or page.url contains '/project-overview/' %}class="top-navigation-current"{% endif %}>{{ link.title }} <i class="arrow down"></i></a>
                      <ul class="dropdown-content">
                          <li><a href="{{ site.url }}/project-overview/">Project Overview</a></li>
                          </ul>
                  </li>
              {% else %}
                  <li><a href="{{ site.url }}{{ link.url }}" {% if url == link.url %}class="top-navigation-current"{% endif %}>{{ link.title }}</a></li>
              {% endif %}
		        {% endfor %}
		    </ul>
		</nav>
	</div></div>
